<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stickman Ragdoll 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ff;font-family:sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.pad{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end}
.pad.l{left:max(16px,env(safe-area-inset-left))}
.pad.r{right:max(16px,env(safe-area-inset-right))}
button{width:84px;height:84px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:30px;touch-action:none;user-select:none;-webkit-user-select:none}
button:active,button.on{background:#000a}
#rag{width:70px;height:70px;font-size:12px;font-weight:bold}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));color:#223;font-size:13px;background:#fff8;padding:4px 10px;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">Active ragdoll: <b id="st">ON</b></div>
<div class="pad l"><button id="bl">◀</button><button id="br">▶</button></div>
<div class="pad r"><button id="rag">RAGDOLL</button><button id="bj">⤒</button></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
